<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background shape -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  
  <!-- Subtle inner border -->
  <rect x="24" y="24" width="464" height="464" rx="95" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.25"/>

  <!-- Center Card Frame -->
  <rect x="110" y="130" width="292" height="252" rx="42" fill="#ffffff" fill-opacity="0.07" stroke="#60a5fa" stroke-width="6" stroke-opacity="0.7" filter="url(#glow)"/>

  <!-- Chart Bars -->
  <!-- Bar 1 -->
  <rect x="156" y="260" width="46" height="85" rx="16" fill="url(#bar1)"/>
  <!-- Bar 2 -->
  <rect x="233" y="200" width="46" height="145" rx="16" fill="url(#bar2)"/>
  <!-- Bar 3 -->
  <rect x="310" y="235" width="46" height="110" rx="16" fill="url(#bar3)"/>

  <!-- Dynamic Trend Line -->
  <path d="M 179 245 L 256 185 L 333 220" fill="none" stroke="#f43f5e" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Peak Dot Indicator -->
  <circle cx="256" cy="185" r="16" fill="#ffffff" stroke="#f43f5e" stroke-width="5"/>

  <!-- Badge Tag Symbol (R$) -->
  <circle cx="370" cy="160" r="28" fill="#10b981" filter="url(#glow)"/>
  <text x="370" y="169" font-family="Arial, sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle">$</text>
</svg>
